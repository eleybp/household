<style>/* Household Finance — design tokens. One bold device: ownership colour. */
:root {
  --bg: #f7f8f6;
  --panel: #ffffff;
  --ink: #17211f;
  --ink-2: #4b5552;
  --ink-3: #7b8582;
  --line: #e3e7e4;
  --line-2: #cfd6d2;
  --shared: #0e7c7b;
  --shared-soft: #e3f2f1;
  --neg: #b42318;
  --neg-soft: #fbeae8;
  --pos: #1e7f4f;
  --pos-soft: #e6f4ec;
  --warn: #b7791f;
  --warn-soft: #fbf1df;
  --accent: #17211f;
  --on-ink: #ffffff;
  color-scheme: light;
  --radius: 6px;
  --rail: 232px;
  --font: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, monospace;
}

/* Dark theme */
html[data-theme='dark'] {
  --bg: #111615; --panel: #1a2120; --ink: #e8ede9; --ink-2: #b7c4bf; --ink-3: #8a9a95; --line: #283130; --line-2: #3a4542;
  --shared: #3fb4b1; --shared-soft: #143231; --neg: #f07b74; --neg-soft: #3b1f1d; --pos: #5cc98f; --pos-soft: #143526; --warn: #e6b04f; --warn-soft: #3a2d15;
  --accent: #e8ede9; --on-ink: #111615; color-scheme: dark;
}
html[data-theme='dark'] .demo-banner { background: #2a3331; color: #dfe6e2; }
html[data-theme='dark'] .chip.info { background: #253030; }
html[data-theme='dark'] .notice.info { background: #222b2a; }
html[data-theme='dark'] .notice { background: var(--warn-soft); border-color: #5a4a26; }
html[data-theme='dark'] .btn.danger { border-color: #6b3a36; }

* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.45; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 22px; }
h2 { font-size: 16px; }
h3 { font-size: 14px; color: var(--ink-2); font-weight: 500; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.warn { color: var(--warn); }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-kpi { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
@media (max-width: 900px) { .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } .grid-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Layout */
.app { display: block; }
.rail { border-right: 1px solid var(--line); background: var(--panel); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
.brand { padding: 4px 10px 14px; }
.brand b { display: block; font-size: 15px; }
.brand span { font-size: 12px; color: var(--ink-3); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius); color: var(--ink-2); font-size: 14px; }
.nav a:hover { background: var(--bg); color: var(--ink); }
.nav a.active { background: var(--ink); color: var(--on-ink); }
.nav a.active .ico { color: var(--on-ink); }
.ico { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.main { min-width: 0; padding: 0 0 80px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
.content { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; max-width: 1240px; }
.tabs-mobile { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { display: none; }
  .topbar { padding: 10px 14px; }
  .content { padding: 14px; }
  .tabs-mobile { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 20; }
  .tabs-mobile a, .tabs-mobile button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--ink-3); padding: 4px 0; background: none; border: 0; }
  .tabs-mobile a.active { color: var(--ink); }
  .tabs-mobile a.active .ico { color: var(--ink); }
}
.sheet { position: fixed; inset: 0; background: rgba(23, 33, 31, 0.35); z-index: 30; display: flex; align-items: flex-end; }
.sheet-body { background: var(--panel); width: 100%; border-radius: 12px 12px 0 0; padding: 14px 14px calc(18px + env(safe-area-inset-bottom)); max-height: 80vh; overflow: auto; }
.sheet-body .nav a { padding: 12px 10px; font-size: 15px; }

/* Demo banner */
.demo-banner { background: #3d4a47; color: #e8ede9; font-size: 13px; padding: 7px 24px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.demo-banner a { text-decoration: underline; }

/* Panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .label { font-size: 12.5px; color: var(--ink-3); }
.kpi .value { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.kpi .sub { font-size: 12px; color: var(--ink-3); }
.hairline { border-top: 1px solid var(--line); margin: 10px 0; }

/* Ownership */
.own-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); }
.own-bar span { display: block; height: 100%; }
.own-bar.tall { height: 22px; border-radius: 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid var(--line-2); color: var(--ink-2); background: var(--panel); }
.chip.shared { border-color: transparent; background: var(--shared-soft); color: var(--shared); }
.chip.ok { background: var(--pos-soft); color: var(--pos); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.over, .chip.bad { background: var(--neg-soft); color: var(--neg); border-color: transparent; }
.chip.info { background: #eef1ef; border-color: transparent; }
.person-mark { width: 3px; align-self: stretch; border-radius: 2px; flex: none; }

/* Progress */
.progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--ink); }
.progress.approaching > span { background: var(--warn); }
.progress.over > span { background: var(--neg); }
.progress.ok > span { background: var(--pos); }

/* Scope toggle */
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.seg button { padding: 6px 12px; border: 0; background: transparent; color: var(--ink-2); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button.active { background: var(--ink); color: var(--on-ink); }
.seg button.active .dot { outline: 2px solid var(--on-ink); }

/* Forms & buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); font-size: 14px; cursor: pointer; }
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.primary:hover { opacity: 0.9; }
.btn.danger { color: var(--neg); border-color: #e8b5b0; }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn.link { border: 0; background: none; padding: 0; color: var(--ink-2); text-decoration: underline; }
.btn:disabled { opacity: 0.5; cursor: default; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); min-width: 0; }
.field input, .field select, .field textarea, .input { padding: 8px 10px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--panel); font-size: 14px; color: var(--ink); width: 100%; }
.field input:focus, .field select:focus, .field textarea:focus, .input:focus { outline: 2px solid rgba(23,33,31,0.25); outline-offset: 0; }
.form-row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.error { color: var(--neg); font-size: 13px; }
.notice { background: var(--warn-soft); border: 1px solid #ecd9b1; border-radius: var(--radius); padding: 10px 12px; font-size: 13px; }
.notice.info { background: #eef1ef; border-color: var(--line); }

/* Tables */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: var(--bg); }
.table-wrap { overflow-x: auto; }
.tx-list { display: flex; flex-direction: column; }
.tx { display: grid; grid-template-columns: 3px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.tx:last-child { border-bottom: 0; }
.tx:hover { background: var(--bg); }
.tx .m { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .d { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; }
.tx .a { font-weight: 600; text-align: right; }

/* Drawer / modal */
.modal-bg { position: fixed; inset: 0; background: rgba(23,33,31,0.4); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--panel); border-radius: 10px; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 600px) { .modal-bg { align-items: flex-end; padding: 0; } .modal { border-radius: 12px 12px 0 0; max-height: 90vh; padding-bottom: calc(18px + env(safe-area-inset-bottom)); } }
.prov { border-top: 1px dashed var(--line-2); margin-top: 10px; padding-top: 10px; font-size: 13px; }
.prov summary { cursor: pointer; color: var(--ink-2); list-style: none; display: flex; align-items: center; gap: 6px; }
.prov summary::-webkit-details-marker { display: none; }
.prov h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin: 10px 0 4px; font-weight: 600; }
.prov ul { margin: 0; padding-left: 16px; }
.prov li { margin: 2px 0; }
.prov .result { font-weight: 600; }

/* Chat */
.chat { display: flex; flex-direction: column; gap: 12px; }
.bubble { padding: 12px 14px; border-radius: 10px; max-width: 760px; white-space: pre-wrap; font-size: 14px; }
.bubble.user { background: var(--ink); color: var(--on-ink); align-self: flex-end; }
.bubble.ai { background: var(--panel); border: 1px solid var(--line); }
.bubble.ai h4 { margin: 8px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
.suggest { display: flex; gap: 8px; flex-wrap: wrap; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line-2); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { padding: 28px 12px; text-align: center; color: var(--ink-3); font-size: 14px; }
.flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr; align-items: center; gap: 8px; }
.flow .arrow { color: var(--line-2); font-size: 18px; }
.flow .box { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.flow .box .label { font-size: 12px; color: var(--ink-3); }
.flow .box .value { font-size: 18px; font-weight: 600; }
@media (max-width: 600px) { .flow { grid-template-columns: 1fr 1fr; } .flow .arrow { display: none; } }
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login .panel { width: 100%; max-width: 400px; }
.bar-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .track { height: 10px; background: var(--line); border-radius: 3px; overflow: hidden; display: flex; }
.recharts-wrapper { font-family: var(--font); font-size: 12px; }

/* Person tabs + sub-tabs */
.person-tabs { display: flex; gap: 6px; padding: 10px 14px 0; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
.person-tabs a, .person-tabs button { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 8px 8px 0 0; font-size: 14px; font-weight: 500; color: var(--ink-2); border: 1px solid transparent; border-bottom: 0; background: none; cursor: pointer; }
.person-tabs .active { color: var(--ink); background: var(--bg); border-color: var(--line); margin-bottom: -1px; }
.person-tabs .swatch { width: 10px; height: 10px; border-radius: 50%; }
.sub-tabs { display: flex; gap: 4px; padding: 8px 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.sub-tabs::-webkit-scrollbar { display: none; }
.sub-tabs a, .sub-tabs button { flex: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; color: var(--ink-2); border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; }
.sub-tabs .active { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.theme-btn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 5px 10px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.big { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.simple-list > div { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 10px; }
.simple-list > div:last-child { border-bottom: 0; }

/* ---------------------------------------------------------------- Motion
   Small, quick, purposeful. Everything here is disabled for people who ask
   their phone to reduce motion. */
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes popIn { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(180, 35, 24, 0.35); } 50% { box-shadow: 0 0 0 6px rgba(180, 35, 24, 0); } }

html { transition: background-color 0.35s ease; }
body, .panel, .kpi, .topbar, .person-tabs, .sub-tabs a, .sub-tabs button, .btn, .input, .field input, .field select, .modal, .bubble.ai, .chip { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }

/* screens: each block rises in, slightly staggered */
.content > * { animation: fadeUp 0.35s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.content > *:nth-child(2) { animation-delay: 0.04s; }
.content > *:nth-child(3) { animation-delay: 0.08s; }
.content > *:nth-child(4) { animation-delay: 0.12s; }
.content > *:nth-child(5) { animation-delay: 0.16s; }
.content > *:nth-child(n + 6) { animation-delay: 0.2s; }
.grid > .kpi, .grid > .panel { animation: fadeUp 0.35s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.grid > *:nth-child(2) { animation-delay: 0.05s; }
.grid > *:nth-child(3) { animation-delay: 0.1s; }
.grid > *:nth-child(4) { animation-delay: 0.15s; }

/* lists: rows cascade in (first dozen only, so long lists stay snappy) */
.tx-list > .tx, .simple-list > div, .table tbody tr { animation: fadeIn 0.3s ease both; }
.tx-list > .tx:nth-child(1), .simple-list > div:nth-child(1), .table tbody tr:nth-child(1) { animation-delay: 0.02s; }
.tx-list > .tx:nth-child(2), .simple-list > div:nth-child(2), .table tbody tr:nth-child(2) { animation-delay: 0.05s; }
.tx-list > .tx:nth-child(3), .simple-list > div:nth-child(3), .table tbody tr:nth-child(3) { animation-delay: 0.08s; }
.tx-list > .tx:nth-child(4), .simple-list > div:nth-child(4), .table tbody tr:nth-child(4) { animation-delay: 0.11s; }
.tx-list > .tx:nth-child(5), .simple-list > div:nth-child(5), .table tbody tr:nth-child(5) { animation-delay: 0.14s; }
.tx-list > .tx:nth-child(6), .simple-list > div:nth-child(6), .table tbody tr:nth-child(6) { animation-delay: 0.17s; }
.tx-list > .tx:nth-child(n + 7), .simple-list > div:nth-child(n + 7), .table tbody tr:nth-child(n + 7) { animation-delay: 0.2s; }

/* bars fill from the left, charts draw themselves */
.progress > span, .own-bar span, .bar-row .track span { transform-origin: left center; animation: growX 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.own-bar span:nth-child(2) { animation-delay: 0.1s; }
.own-bar span:nth-child(3) { animation-delay: 0.2s; }
svg.chart path[fill='none'] { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease-out 0.1s forwards; }
svg.chart path[opacity] { animation: fadeIn 0.6s ease 0.7s both; }
svg.chart rect { transform-box: fill-box; transform-origin: bottom; animation: growY 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.recharts-line-curve, .recharts-area-curve { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: drawLong 1.2s ease-out forwards; }
@keyframes drawLong { to { stroke-dashoffset: 0; } }

/* touch feedback */
.btn, .sub-tabs a, .sub-tabs button, .person-tabs a, .person-tabs button, .seg button, .theme-btn, .fab, .tx, .table tr.clickable, .kpi a, .chip[data-act] { transition: transform 0.12s ease, background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease; }
.btn:active, .sub-tabs a:active, .sub-tabs button:active, .person-tabs button:active, .seg button:active, .theme-btn:active, .fab:active { transform: scale(0.95); }
.tx:active, .table tr.clickable:active td { background: var(--line); }
.btn.primary:hover { transform: translateY(-1px); }
.fab { animation: popIn 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) 0.3s both; transition: transform 0.15s ease; }
.fab:active { transform: scale(0.9) rotate(90deg); }

/* tabs: the active pill eases in */
.sub-tabs .active, .seg button.active, .nav a.active, .person-tabs .active { animation: fadeIn 0.25s ease both; }

.modal-bg, .sheet { animation: fadeIn 0.2s ease both; }
.modal, .sheet-body { animation: slideUp 0.28s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.toast { transition: opacity 0.25s ease, transform 0.25s ease; transform: translateX(-50%) translateY(6px); }
.toast.show { transform: translateX(-50%) translateY(0); }

/* attention: over-budget and critical chips pulse once */
.chip.over, .chip.bad { animation: pulse 1.2s ease 0.4s 2; }
.progress.over > span { animation: growX 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both, pulse 1.2s ease 0.8s 2; }

/* details drawers */
details > *:not(summary) { animation: fadeUp 0.25s ease both; }
.prov summary::before { content: '▸'; display: inline-block; transition: transform 0.2s ease; margin-right: 4px; }
.prov[open] summary::before { transform: rotate(90deg); }

/* numbers counting up (set by the app) */
.counting { font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-delay: 0s !important; transition-duration: 0.001ms !important; }

  + `<h2>Budgets</h2><div class="grid grid-4">${stat('Budgeted', money(r.totalLimit))}${stat('Spent', money(r.totalSpent))}${stat('Remaining', money(r.totalRemaining), '', r.totalRemaining < 0 ? 'neg' : '')}${stat('Unbudgeted', money(r.unbudgetedSpent), 'spending outside budgets')}</div>` + panel('', r.lines.length ? `<div class="stack" style="gap:16px">${r.lines.map((l) => `<div class="stack" style="gap:6px"><div class="row between wrap"><div class="row"><b>${esc(l.name)}</b>${chip(l.status === 'over' ? `over by ${money(l.overBy)}` : l.status === 'approaching' ? `${pct(l.usedPct)} used` : `${money(l.remaining)} left`, l.status === 'ok' ? 'ok' : l.status)}</div><span class="row"><span class="num small"><b>${money(l.spent)}</b> <span class="muted">/ ${money(l.limit)}</span></span>${btn('Edit', 'editBudget', l.budgetId)}${btn('✕', 'delBudget', l.budgetId, 'btn small danger')}</span></div>${progress(l.usedPct, l.status)}${prov(l.provenance)}</div>`).join('')}</div>` : '<div class="empty">No budgets yet. Budgets apply to the whole household.</div>'); };
V.bills = () => { const t = D.totals; return `<div class="row between wrap"><h1>Bills & subscriptions</h1>${btn('+ Add bill', 'addBill', undefined, 'btn primary small')}</div><div class="grid grid-4">${stat('Recurring per month', money(t.monthly), `${t.count} active items`)}${stat('Per year', money(t.annual))}${stat('Subscriptions', money(t.subscriptionsMonthly) + '<span class="small muted">/mo</span>', `${t.subscriptionCount} services`)}${stat('Needs review', String(t.reviewList.length), 'subscriptions not yet confirmed', t.reviewList.length ? 'warn' : '')}</div>`
  + (t.reviewList.length ? panel('Forgotten subscriptions? Confirm these are wanted', `<div class="stack">${t.reviewList.map((s) => `<div class="row between wrap"><span class="row"><i class="person-mark" style="background:${s.splitMode === 'shared' ? 'var(--shared)' : color(s.personId)};height:18px"></i><b>${esc(s.name)}</b> <span class="muted small">${money(s.expectedAmount)} ${s.frequency}</span></span><span class="row">${btn('Keep', 'review', s.merchantPattern + '|keep')}${btn('Cancelled it', 'review', s.merchantPattern + '|cancel', 'btn small danger')}</span></div>`).join('')}</div>`) : '')
  + panel('Due in the next 30 days', D.bills30.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Due</th><th>Bill</th><th>Who</th><th class="num">Amount</th></tr></thead><tbody>${D.bills30.map((b) => `<tr><td class="num">${short(b.dueOn)}</td><td>${esc(b.name)}</td><td>${personChip(b.personId, b.splitMode)}</td><td class="num">${money(b.expectedAmount)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Nothing due. Recurring bills are detected automatically after 2+ occurrences, or add one manually.</div>')
  + panel('All recurring items', `<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Every</th><th>Next</th><th>Who</th><th class="num">Amount</th><th></th></tr></thead><tbody>${D.recurring.map((i) => `<tr style="opacity:${i.status === 'active' ? 1 : 0.5}"><td><b>${esc(i.name)}</b>${i.isSubscription ? ' ' + chip('subscription', 'info') : ''}${!i.detected ? ' <span class="tiny muted">manual</span>' : ''}</td><td>${i.frequency}</td><td class="num">${short(i.nextDue)}</td><td>${personChip(i.personId, i.splitMode)}</td><td class="num">${money(i.expectedAmount)}</td><td>${i.detected ? (i.status === 'active' ? btn('Ended', 'review', i.merchantPattern + '|cancel') : btn('Restore', 'review', i.merchantPattern + '|keep')) : btn('✕', 'delBill', i.id, 'btn small danger')}</td></tr>`).join('')}</tbody></table></div>`); };
V.goals = () => `<div class="row between"><h1>Objectives</h1>${btn('+ Objective', 'addGoal', undefined, 'btn primary small')}</div>` + (D.goals.length ? `<div class="grid grid-2">${D.goals.map((g) => panel(`${esc(g.goal.name)} ${chip(g.status.replace('_', ' '), g.status === 'on_track' || g.status === 'complete' ? 'ok' : g.status === 'behind' ? 'warn' : 'info')}`, `<div class="row between"><span class="num" style="font-size:22px;font-weight:600">${money(g.goal.currentAmount)}</span><span class="muted">of ${money(g.goal.targetAmount)} · ${pct(g.progressPct)}</span></div>${progress(g.progressPct, g.status === 'behind' ? 'approaching' : '')}<div class="small muted" style="margin-top:6px">${g.goal.targetDate ? `Target ${g.goal.targetDate} · needs <b class="num">${money(g.requiredMonthly)}</b>/mo · pace <b class="num">${money(g.recentMonthlyAverage)}</b>/mo` : 'No target date'}</div><div style="margin-top:10px"><div class="tiny muted" style="margin-bottom:4px">Who has contributed</div>${ownBar(D.persons.map((p) => ({ personId: p.id, amount: g.contributionsByPerson[p.id] || 0 })), false, true)}</div><div class="row wrap" style="margin-top:10px">${btn('+ Contribution', 'contribute', g.goal.id)}${btn('Edit', 'editGoal', g.goal.id)}${btn('Delete', 'delGoal', g.goal.id, 'btn small danger')}</div>${prov(g.provenance)}`)).join('')}</div>` : panel('', '<div class="empty">No objectives yet — an emergency fund, a trip, a down payment.</div>'));
V.investments = () => { const p = SC().portfolio; return `<div class="row between"><h1>Investments</h1>${btn('+ Holding', 'addHolding', undefined, 'btn primary small')}</div><div class="grid grid-4">${stat('Portfolio value', money(p.totalValue))}${stat('Cost basis', money(p.totalCost))}${stat('Unrealised gain', money(p.unrealizedGain, true), pct(p.unrealizedGainPct, 1), p.unrealizedGain >= 0 ? 'pos' : 'neg')}${stat('Realised gain', money(p.realizedGain, true))}</div>` + (UI.scope === 'household' && p.byPerson.length ? panel('Who owns the portfolio', ownBar(p.byPerson.map((b) => ({ personId: b.personId, amount: b.value, label: b.name })), true, true)) : '') + panel('Holdings', p.holdings.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Symbol</th><th>Owner</th><th class="num">Shares</th><th class="num">Avg cost</th><th class="num">Price</th><th class="num">Value</th><th class="num">Gain</th><th></th></tr></thead><tbody>${p.holdings.map((h) => `<tr><td><b>${esc(h.symbol)}</b><div class="tiny muted">${esc(h.name)} · ${h.assetClass}</div></td><td>${name(h.personId)}</td><td class="num">${h.quantity}</td><td class="num">${money(h.averageCost)}</td><td class="num">${money(h.currentPrice)}</td><td class="num">${money(h.currentValue)}</td><td class="num ${h.unrealizedGain >= 0 ? 'pos' : 'neg'}">${money(h.unrealizedGain, true)}</td><td>${btn('Edit', 'editHolding', h.id)}</td></tr>`).join('')}</tbody></table></div>${prov(p.provenance)}` : '<div class="empty">Add holdings by hand (symbol, shares, average cost, current price) — update the price whenever you like.</div>') + `<p class="tiny muted">Past performance does not guarantee future results.</p>`; };
V.networth = () => { const s = SC(), c = s.netWorth, b = c.breakdown; const liab = (t) => ['credit_card', 'loan', 'other_liability'].includes(t); const w = (a) => (UI.scope === 'household' ? 1 : a.ownerPersonId === UI.scope ? 1 : a.ownerPersonId === null ? 1 / D.persons.length : 0);
  return `<div><h1 class="num">${money(c.netWorth)}</h1><p class="muted small">assets ${money(c.totalAssets)} − liabilities ${money(c.totalLiabilities)}</p></div>` + panel('Trend', lineChart([{ name: 'Assets', color: '#1e7f4f', values: s.history.map((h) => h.assets) }, { name: 'Liabilities', color: '#b42318', values: s.history.map((h) => h.liabilities) }, { name: 'Net worth', color: 'var(--ink)', values: s.history.map((h) => h.netWorth) }], s.history.map((h) => monthName(h.month).slice(0, 3)), 240) + '<p class="tiny muted">History builds up automatically each month you open the app.</p>')
  + `<div class="grid grid-2">${panel('Assets', ['checking', 'savings', 'cash', 'investments', 'retirement', 'otherAssets'].filter((k) => b[k]).map((k) => `<div class="row between small" style="padding:4px 0"><span>${k}</span><b class="num">${money(b[k])}</b></div>`).join('') + `<div class="hairline"></div><div class="row between"><b>Total</b><b class="num">${money(c.totalAssets)}</b></div>`)}${panel('Liabilities', ['creditCards', 'loans', 'otherLiabilities'].filter((k) => b[k]).map((k) => `<div class="row between small" style="padding:4px 0"><span>${k}</span><b class="num neg">${money(b[k])}</b></div>`).join('') + `<div class="hairline"></div><div class="row between"><b>Total</b><b class="num">${money(c.totalLiabilities)}</b></div>`)}</div>`
  + panel('Accounts', `<div class="table-wrap"><table class="table"><thead><tr><th>Account</th><th>Owner</th><th class="num">Balance</th></tr></thead><tbody>${S.accounts.filter((a) => w(a) > 0).map((a) => `<tr class="clickable" data-act="editAccount" data-arg="${a.id}"><td><b>${esc(a.name)}</b><div class="tiny muted">${esc(a.institutionName || '')} ${a.type.replace('_', ' ')}${a.includeInNetWorth ? '' : ' · excluded'}</div></td><td>${name(a.ownerPersonId)}</td><td class="num ${liab(a.type) ? 'neg' : ''}">${money(a.currentBalance)}${UI.scope !== 'household' && w(a) < 1 ? `<div class="tiny muted">${Math.round(w(a) * 100)}% counted</div>` : ''}</td></tr>`).join('')}</tbody></table></div>${prov(c.provenance)}`); };
V.debt = () => { const s = SC(), d = s.debtSummary; return `<div class="row between"><h1>Debts</h1>${btn('+ Debt', 'addDebt', undefined, 'btn primary small')}</div><div class="grid grid-4">${stat('Total balance', money(d.totalBalance))}${stat('Monthly payments', money(d.totalPayment), `minimums ${money(d.totalMinimum)}`)}${stat('Interest this month', money(d.totalMonthlyInterest), '', 'neg')}${stat('Interest to payoff', money(d.projectedInterest), 'at current payments (estimate)')}</div>` + (UI.scope === 'household' && d.totalBalance ? panel('Whose debt', ownBar([...D.persons.map((p) => ({ personId: p.id, amount: d.byPerson[p.id] || 0 })), { personId: null, amount: d.jointBalance, label: 'Joint' }], true, true)) : '') + (s.debts.length ? `<div class="grid grid-2">${s.debts.map((a) => panel(`${esc(a.debt.name)} <span class="tiny muted">${a.debt.kind.replace('_', ' ')} · ${name(a.debt.personId)} · ${a.debt.interestRate}% APR</span>`, `<div class="row between"><span class="num" style="font-size:22px;font-weight:600">${money(a.debt.currentBalance)}</span><span class="muted small">${a.paidOffPct.toFixed(0)}% paid of ${money(a.debt.originalBalance)}</span></div>${progress(a.paidOffPct, 'ok')}<div class="grid grid-3 small" style="margin-top:10px;gap:8px"><div><div class="muted tiny">Paying</div><b class="num">${money(a.payment)}/mo</b></div><div><div class="muted tiny">Payoff</div><b>${a.payoffMonth ? monthName(a.payoffMonth) : '—'}</b><div class="tiny muted">${a.monthsRemaining !== null ? a.monthsRemaining + ' months' : 'payment < interest'}</div></div><div><div class="muted tiny">Total interest</div><b class="num neg">${a.totalInterest !== null ? money(a.totalInterest) : '—'}</b></div></div>${a.versusMinimum && a.versusMinimum.monthsSaved > 0 ? `<p class="small pos" style="margin-top:8px">Paying above the minimum saves ~${a.versusMinimum.monthsSaved} months and ${money(a.versusMinimum.interestSaved)}.</p>` : ''}<div class="row" style="margin-top:8px">${btn('Edit', 'editDebt', a.debt.id)}${btn('Delete', 'delDebt', a.debt.id, 'btn small danger')}</div>`)).join('')}</div>` : panel('', '<div class="empty">No debts tracked.</div>')); };
V.fairsplit = () => { const r = D.fairSplit, st = r.settlement; return `<div class="row between wrap">${monthNav()}${btn(`Split rule: ${r.defaultMethod.replace('_', ' ')}`, 'splitRule')}</div>` + panel('Settlement', (st ? `<span style="font-size:20px;font-weight:600"><span style="color:${color(st.from)}">${name(st.from)}</span> owes <span style="color:${color(st.to)}">${name(st.to)}</span> <span class="num">${money(st.amount)}</span></span> <span class="muted small">to even out ${monthName(D.month)}'s shared expenses</span>` : '<p class="pos">Shared expenses are balanced this month.</p>') + prov(r.provenance)) + `<div class="grid grid-3">${stat('Shared expenses', money(r.sharedTotal), `${money(r.jointPaid)} from joint accounts`)}${stat('Personal expenses', money(r.personalTotal), 'not split')}${panel('Income weights', r.persons.map((p) => `<div class="row between small"><span><i class="dot" style="background:${color(p.personId)}"></i>${esc(p.personName)}</span><b>${pct(p.incomeWeight)}</b></div>`).join(''))}</div>` + panel('Expected vs actual', `<div class="table-wrap"><table class="table"><thead><tr><th>Person</th><th class="num">Expected</th><th class="num">Paid directly</th><th class="num">Joint share</th><th class="num">Actual</th><th class="num">Difference</th></tr></thead><tbody>${r.persons.map((p) => `<tr><td><i class="dot" style="background:${color(p.personId)}"></i>${esc(p.personName)}</td><td class="num">${money(p.expected)}</td><td class="num">${money(p.paidDirect)}</td><td class="num">${money(p.jointShare)}</td><td class="num"><b>${money(p.actual)}</b></td><td class="num ${p.difference > 0 ? 'pos' : p.difference < 0 ? 'neg' : ''}">${money(p.difference, true)}</td></tr>`).join('')}</tbody></table></div>`) + panel('Shared expenses this month', txList(S.transactions.filter((t) => t.splitMode === 'shared' && t.amount > 0 && E.monthKey(t.postedAt) === D.month && E.kindOf(t, D.categoriesById) === 'expense').slice(0, 60))); };
V.forecast = () => { const f = D.forecast, b = f.baseline; const sc = f.scenarios[UI.scenario] || f.scenarios[0]; const labels = b.months.map((m) => monthName(m.month).slice(0, 3));
  return `<div class="notice">Estimates only — expected after-tax income, active bills, a 3-month average of variable spending, debt payments and planned saving/investing (set in Settings).</div><div class="grid grid-3">${stat('Cash today', money(b.startingCash))}${stat('Cash in 12 months', money(b.endingCash), 'baseline')}${stat('Lowest point', money(b.lowestCash.amount), monthName(b.lowestCash.month), b.lowestCash.amount < 0 ? 'neg' : '')}</div>` + panel('What if…', `<div class="row wrap" style="margin-bottom:10px">${f.scenarios.map((s, i) => `<button class="btn small ${i === UI.scenario ? 'primary' : ''}" data-scn="${i}">${esc(s.label)}</button>`).join('')}</div>` + lineChart([{ name: 'Baseline', color: '#8a9a95', values: b.months.map((m) => m.endingCash) }, { name: sc.label, color: 'var(--ink)', values: sc.result.months.map((m) => m.endingCash), area: true }], labels, 240) + `<p class="small" style="margin-top:8px">With “${esc(sc.label)}”: ending cash <b class="num ${sc.comparison.endingCashDelta >= 0 ? 'pos' : 'neg'}">${money(sc.comparison.endingCashDelta, true)}</b> vs baseline.</p>${prov(sc.result.provenance)}`) + panel('Month by month (baseline)', `<div class="table-wrap"><table class="table"><thead><tr><th>Month</th><th class="num">Net income</th><th class="num">Bills</th><th class="num">Variable</th><th class="num">Debt</th><th class="num">Saved</th><th class="num">End</th></tr></thead><tbody>${b.months.map((m) => `<tr><td>${monthName(m.month)}</td><td class="num pos">${money(m.netIncome)}</td><td class="num">${money(m.bills)}</td><td class="num">${money(m.variableSpend)}</td><td class="num">${money(m.debtPayments)}</td><td class="num">${money(m.savings + m.investments)}</td><td class="num"><b>${money(m.endingCash)}</b></td></tr>`).join('')}</tbody></table></div>`); };
V.reports = () => { const s = SC(); const labels = s.monthly.map((m) => monthName(m.month).slice(0, 3)); return `<h1>Reports — ${scopeName()}</h1>` + panel('Income vs expenses — last 6 months', barChart([{ name: 'Income', color: '#1e7f4f', values: s.monthly.map((m) => m.income) }, { name: 'Expenses', color: '#b42318', values: s.monthly.map((m) => m.expenses) }, { name: 'Saved', color: '#0e7c7b', values: s.monthly.map((m) => m.setAside) }], labels)) + `<div class="grid grid-2">${panel(`Spending by category — ${monthName(D.month)}`, s.spending.groups.map((g) => `<div class="bar-row" style="margin-bottom:6px"><span>${esc(g.name)}</span><div class="track"><span style="width:${g.share}%;background:var(--ink)"></span></div><span class="num">${money(g.amount)}</span></div>`).join('') || '<div class="empty">No spending.</div>')}${panel('Change vs last month', `<div class="table-wrap"><table class="table"><thead><tr><th>Category</th><th class="num">Last</th><th class="num">This</th><th class="num">Change</th></tr></thead><tbody>${s.categoryChanges.slice(0, 10).map((c) => `<tr><td>${esc(c.name)}</td><td class="num muted">${money(c.previous)}</td><td class="num">${money(c.current)}</td><td class="num ${c.current - c.previous > 0 ? 'neg' : 'pos'}">${money(c.current - c.previous, true)}</td></tr>`).join('')}</tbody></table></div>`)}</div>` + panel('Top merchants', `<div class="table-wrap"><table class="table"><thead><tr><th>Merchant</th><th class="num">Visits</th><th class="num">Total</th></tr></thead><tbody>${s.merchants.map((x) => `<tr><td>${esc(x.merchant)}</td><td class="num">${x.count}</td><td class="num">${money(x.amount)}</td></tr>`).join('')}</tbody></table></div>`) + `<div class="row">${btn('Export all transactions (CSV)', 'exportCsv')}</div>`; };
V.transactions = () => { const q = UI.q.toLowerCase(); const list = S.transactions.filter((t) => !q || t.merchantName.toLowerCase().includes(q) || catLabel(t.categoryId).toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q)); return panel('', `<div class="row wrap"><input class="input" id="q" placeholder="Search merchant, category, note" value="${esc(UI.q)}" style="flex:1" />${btn('Import CSV', 'importCsv')}${btn('+ Add', 'addTx', undefined, 'btn small primary')}</div><p class="tiny muted" style="margin-top:6px">${list.length} transactions · tap one to edit its category, who paid, shared/personal, or note.</p>`) + panel('', txList(list.slice(0, 200))); };
V.accounts = () => `<div class="row between"><h1>Accounts</h1><span class="row">${btn('Import statement (CSV)', 'importCsv')}${btn('+ Account', 'addAccount', undefined, 'btn primary small')}</span></div>` + panel('How money gets in', `<p class="small">This edition keeps everything on your phone — nothing is sent anywhere. Bank data comes from the statements your bank app lets you download:</p><ul class="small" style="margin:6px 0 0;padding-left:18px"><li><b>Chase:</b> chase.com (Safari) → account → <i>Download account activity</i> → CSV. Or Chase app → account → ⋯ → Statements &amp; documents.</li><li><b>Revolut:</b> app → account → Statement → CSV.</li><li>Anything else: add manually, or import any CSV with date / description / amount columns.</li></ul><p class="tiny muted" style="margin-top:6px">Live bank linking (Plaid) needs a server; the full edition in the download supports it.</p>`) + panel('Your accounts', S.accounts.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Account</th><th>Type</th><th>Owner</th><th class="num">Balance</th></tr></thead><tbody>${S.accounts.map((a) => `<tr class="clickable" data-act="editAccount" data-arg="${a.id}"><td><span class="row"><i class="person-mark" style="background:${color(a.ownerPersonId)};height:18px"></i><span><b>${esc(a.name)}</b> <span class="muted">${esc(a.institutionName || '')}</span>${a.isDemo ? ' ' + chip('demo', 'info') : ''}</span></span></td><td>${a.type.replace('_', ' ')}</td><td>${name(a.ownerPersonId)}</td><td class="num ${['credit_card', 'loan'].includes(a.type) ? 'neg' : ''}">${money(a.currentBalance)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No accounts yet.</div>');
V.planner = () => `<h1>Planner</h1>` + panel('', `<p class="small">Ask about your own numbers. Answers come from the same calculations as every other tab and show <b>source data → calculation → result</b>.</p><form class="row" id="askForm" style="margin-top:8px"><input class="input" id="ask" placeholder="e.g. How much can we spend on fun this month?" style="flex:1" /><button class="btn primary">Ask</button></form><div class="suggest" style="margin-top:8px">${['How much can we spend on fun this month?', 'What are our biggest expenses?', 'How much should we keep for upcoming bills?', `If ${D.persons[0]?.name} works 10 hours of overtime, how much extra do we take home?`, 'How much do we pay for subscriptions per year?', 'How are we doing on debt?', 'What is our savings rate?'].map((q) => `<button class="btn small" data-ask="${esc(q)}">${esc(q)}</button>`).join('')}</div>`) + `<div class="chat" id="chat">${(UI.chat || []).map((m) => m.role === 'user' ? `<div class="bubble user">${esc(m.text)}</div>` : `<div class="bubble ai">${m.html}</div>`).join('')}</div>`;
V.settings = () => panel('People', `<div class="stack">${S.persons.map((p) => `<div class="row between wrap"><span class="row"><i class="dot" style="background:${p.color}"></i><b>${esc(p.name)}</b> <span class="muted small">$${p.hourlyRate}/h · ${p.hoursPerWeek}h/wk · OT $${p.overtimeRate}</span></span>${btn('Edit', 'editPerson', p.id)}</div>`).join('')}</div>`) + panel('Household', `<div class="simple-list small"><div><span>Default split of shared expenses</span><b>${D.fairSplit.defaultMethod.replace('_', ' ')}</b></div><div><span>Planned savings / month</span><b class="num">${money(S.household.plannedSavings)}</b></div><div><span>Planned investing / month</span><b class="num">${money(S.household.plannedInvest)}</b></div></div><div class="row wrap" style="margin-top:8px">${btn('Edit', 'editHousehold')}${btn('Split rule', 'splitRule')}</div>`) + panel('Appearance', `${btn(document.documentElement.dataset.theme === 'dark' ? '☀ Switch to light' : '☾ Switch to dark', 'theme')}`) + panel('Categorisation rules', `<p class="small muted">Your rules win over the ${E.DEFAULT_MERCHANT_RULES.length} built-in ones. Add one from any transaction with “always categorise this way”.</p><div class="stack" style="margin-top:6px">${S.rules.map((r, i) => `<div class="row between small"><span><code>${esc(r.pattern)}</code> → ${esc(catLabel(r.categorySlug))}</span>${btn('✕', 'delRule', i, 'btn small danger')}</div>`).join('') || '<span class="small muted">None yet.</span>'}</div>`) + panel('Your data', `<p class="small muted">Everything lives in this browser on this phone. Back it up now and then — clearing Safari/Chrome data would erase it.</p><div class="row wrap" style="margin-top:8px">${btn('Back up (download JSON)', 'exportJson', undefined, 'btn primary')}${btn('Restore from backup', 'importJson')}${S.household.demo ? btn('Remove demo data', 'removeDemo') : btn('Load demo data', 'loadDemo')}${btn('Erase everything', 'reset', undefined, 'btn danger')}</div>`);

// ---------------------------------------------------------------- planner (deterministic)
function answer(q) {
  const s = D.scopes.household, L = q.toLowerCase(); const t = [];
  const block = (title, src, calc, res) => `<b>${esc(title)}</b><h4>Source data</h4><ul style="margin:0;padding-left:16px">${src.map((x) => `<li>${esc(x[0])}: <b class="num">${typeof x[1] === 'number' ? money(x[1]) : esc(x[1])}</b></li>`).join('')}</ul><h4>Calculation</h4><ul style="margin:0;padding-left:16px">${calc.map((c) => `<li>${esc(c)}</li>`).join('')}</ul><h4>Result</h4><b>${esc(res)}</b>`;
  const person = D.persons.find((p) => L.includes(p.name.toLowerCase()));
  if (/subscription|recurring/.test(L)) t.push(block('Subscriptions', D.recurring.filter((r) => r.isSubscription && r.status === 'active').map((r) => [r.name, r.expectedAmount]), [`Monthly equivalents summed = ${money(D.totals.subscriptionsMonthly)}`, `× 12 = ${money(D.totals.subscriptionsMonthly * 12)} per year`], `${money(D.totals.subscriptionsMonthly * 12)} per year on subscriptions`));
  const catQ = /subscription/.test(L) ? null : ['groceries', 'restaurants', 'coffee', 'food', 'fun', 'shopping', 'fuel', 'gas', 'utilities', 'subscriptions', 'entertainment', 'transportation', 'housing', 'rent', 'clothing'].find((c) => L.includes(c));
  if (/budget|left|remaining/.test(L) && catQ && !person) { const line = D.budget.lines.find((l) => l.slug.includes(catQ === 'gas' ? 'fuel' : catQ) || l.name.toLowerCase().includes(catQ)); if (line) t.push(block(`${line.name} budget — ${monthName(D.month)}`, [['Limit', line.limit], ['Spent so far', line.spent]], [`Remaining = ${money(line.limit)} − ${money(line.spent)} = ${money(line.remaining)}`, `${Math.round(line.usedPct)}% used`], `${money(line.remaining)} left for ${line.name}`)); }
  if (catQ && !t.length) { const sc = person ? D.scopes[person.id] : s; const g = sc.spending.groups.find((x) => x.slug.includes(catQ === 'gas' ? 'fuel' : catQ) || x.name.toLowerCase().includes(catQ)) || sc.spending.groups.flatMap((x) => x.children.map((c) => ({ ...c, parent: x.name }))).find((c) => c.slug?.includes(catQ) || c.name.toLowerCase().includes(catQ)); t.push(block(`${catQ} spending — ${monthName(D.month)} — ${person ? person.name : 'Household'}`, g ? [[g.name, g.amount]] : [], [person ? 'Personal purchases in full + their share of shared purchases' : 'All household purchases in the category', `Total ${money(g?.amount || 0)}`], `${money(g?.amount || 0)} on ${catQ} this month`)); }
  if (/biggest|largest|most|where/.test(L)) t.push(block(`Biggest expenses — ${monthName(D.month)}`, s.spending.groups.slice(0, 5).map((g) => [g.name, g.amount]), ['Expenses grouped by category; transfers, savings and investing excluded', `Total spending ${money(s.spending.total)}`], s.spending.groups[0] ? `${s.spending.groups[0].name}: ${money(s.spending.groups[0].amount)}` : 'No spending recorded'));
  if (/bill|keep|untouched|due|hold/.test(L)) { const tot = D.bills30.reduce((a, b) => a + b.expectedAmount, 0); t.push(block('Cash to hold for the next 30 days', D.bills30.map((b) => [`${b.name} (${short(b.dueOn)})`, b.expectedAmount]), [`Sum of bills due in 30 days = ${money(tot)}`, `Cash now ${money(D.startingCash)} → free after bills ${money(D.startingCash - tot)}`], `Keep ${money(tot)} available`)); }
  if (/overtime|extra hours/.test(L)) { const hrs = Number((L.match(/(\d+)\s*h/) || [])[1] || 10); const targets = person ? [person] : D.persons; const rows = targets.map((p) => { const pi = D.income.persons.find((x) => x.personId === p.id); const rate = pi.monthlyGross ? pi.taxes.total / pi.monthlyGross : 0; return { p, pi, gross: hrs * pi.overtimeRate, net: hrs * pi.overtimeRate * (1 - rate), rate }; }); t.push(block(`Overtime: +${hrs} hours/month`, rows.map((r) => [`${r.p.name} overtime rate`, r.pi.overtimeRate]), rows.map((r) => `${r.p.name}: ${hrs}h × $${r.pi.overtimeRate} = ${money(r.gross)} gross → ≈ ${money(r.net)} after ~${(r.rate * 100).toFixed(0)}% estimated tax`), `≈ ${money(rows.reduce((a, r) => a + r.net, 0))} extra take-home per month (estimate)`)); }
  if (/debt|loan|pay off|owe/.test(L)) t.push(block('Debt', s.debts.map((a) => [a.debt.name, a.debt.currentBalance]), s.debts.map((a) => `${a.debt.name}: ${money(a.payment)}/mo at ${a.debt.interestRate}% → ${a.monthsRemaining !== null ? a.monthsRemaining + ' months, ' + money(a.totalInterest) + ' interest' : 'payment does not cover interest'}`), `Total ${money(s.debtSummary.totalBalance)}, ${money(s.debtSummary.totalPayment)}/month`));
  if (/saving|save|rate|kept/.test(L) && !/save \$/.test(L)) t.push(block(`Savings — ${monthName(D.month)}`, [['Income received', s.summary.income], ['Expenses', s.summary.expenses], ['Debt payments', s.summary.debtPayments], ['Saved + invested', s.summary.setAside]], [`Net cash flow = income − expenses − debt = ${money(s.summary.netCashFlow)}`, `Savings rate = set aside ÷ income = ${pct(s.summary.savingsRate)}`], `${pct(s.summary.savingsRate)} savings rate`));
  if (/net worth|worth/.test(L)) t.push(block('Net worth', [['Assets', s.netWorth.totalAssets], ['Liabilities', s.netWorth.totalLiabilities]], ['Net worth = assets − liabilities'], money(s.netWorth.netWorth)));
  if (/afford|purchase|buy/.test(L)) { const amt = Number(((L.match(/\$\s?([\d,]+)/) || [])[1] || '2000').replace(/,/g, '')); const r = E.forecastCashFlow({ startMonth: D.month, months: 6, startingCash: D.startingCash, income: D.incomeInputs, recurring: D.recurring.filter((x) => x.status === 'active'), debts: S.debts, variableMonthly: D.forecast.baseline.provenance.sourceData[3].value, plannedSavingsMonthly: S.household.plannedSavings, plannedInvestmentMonthly: S.household.plannedInvest, categoriesById: D.categoriesById, scenario: { oneTimePurchases: [{ month: E.addMonths(D.month, 1), amount: amt, label: 'purchase' }] } }); t.push(block(`Can we afford a ${money(amt)} purchase next month? (estimate)`, [['Cash today', D.startingCash], ['Purchase', amt]], [`6-month forecast with the purchase: lowest cash ${money(r.lowestCash.amount)} in ${monthName(r.lowestCash.month)}`, `Ending cash ${money(r.endingCash)}`], r.lowestCash.amount > 500 ? `Yes — cash stays above ${money(r.lowestCash.amount)} (estimate)` : `Tight — cash would dip to ${money(r.lowestCash.amount)}`)); }
  if (!t.length) t.push(block('I can answer about', [], ['budgets and category spending ("how much on food?")', 'biggest expenses, bills to hold cash for, subscriptions per year', 'overtime scenarios, debt payoff, savings rate, net worth, "can we afford $X"'], 'Try one of the suggestions above'));
  return t.join('<div class="hairline"></div>');
}

// ---------------------------------------------------------------- modal forms
function modal(title, bodyHtml) { UI.modal = `<div class="modal-bg" data-close="1"><div class="modal"><div class="row between"><h2>${title}</h2><button class="btn small" data-close="1">✕</button></div>${bodyHtml}</div></div>`; render(); }
function closeModal() { UI.modal = null; render(); }
const F = {
  text: (k, l, v = '', extra = '') => `<label class="field"><span>${l}</span><input name="${k}" value="${esc(v)}" ${extra}/></label>`,
  num: (k, l, v = '', step = '0.01', extra = '') => `<label class="field"><span>${l}</span><input name="${k}" type="number" step="${step}" value="${v ?? ''}" inputmode="decimal" ${extra}/></label>`,
  date: (k, l, v) => `<label class="field"><span>${l}</span><input name="${k}" type="date" value="${v || ''}" /></label>`,
  sel: (k, l, opts, v) => `<label class="field"><span>${l}</span><select name="${k}">${opts.map((o) => `<option value="${esc(o[0])}" ${String(o[0]) === String(v) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`,
  check: (k, l, v) => `<label class="row small"><input type="checkbox" name="${k}" ${v ? 'checked' : ''}/> ${l}</label>`,
  cat: (k, v) => { const cats = categories(); return `<label class="field"><span>Category</span><select name="${k}"><option value="">Uncategorised</option>${cats.filter((c) => !c.parentId).map((p) => `<optgroup label="${esc(p.name)}"><option value="${p.id}" ${v === p.id ? 'selected' : ''}>${esc(p.name)} (general)</option>${cats.filter((c) => c.parentId === p.id).map((c) => `<option value="${c.id}" ${v === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('')}</select></label>`; },
  who: (k, v, joint = true) => F.sel(k, 'Who', [...(joint ? [['', 'Joint / shared account']] : []), ...S.persons.map((p) => [p.id, p.name])], v ?? ''),
  form: (fields, submitLabel = 'Save', extraButtons = '') => `<form id="mf" class="stack" style="gap:12px">${fields}<div class="row between">${extraButtons || '<span></span>'}<button class="btn primary">${submitLabel}</button></div></form>`,
};
function formData() { const f = document.getElementById('mf'); const o = {}; for (const el of f.elements) if (el.name) o[el.name] = el.type === 'checkbox' ? el.checked : el.value; return o; }
const numv = (v, d = 0) => (v === '' || v === undefined || v === null ? d : Number(v));
let onSubmit = null;

const ACT = {
  month(arg) { UI.month = E.addMonths(UI.month, Number(arg)); },
  theme() { const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; localStorage.setItem('hf.theme', next); },
  loadDemo() { loadDemo(); toast('Demo data loaded'); },
  removeDemo() { if (confirm('Remove all demo data?')) removeDemo(); },
  reset() { if (prompt('Type ERASE to delete everything on this phone') === 'ERASE') { localStorage.removeItem(KEY); location.reload(); } },
  exportJson() { const blob = new Blob([JSON.stringify(S)], { type: 'application/json' }); dl(blob, `household-backup-${today()}.json`); },
  importJson() { modal('Restore from backup', F.form(`<p class="small muted">Choose a household-backup-*.json file. This replaces what is on the phone now.</p><label class="field"><span>Backup file</span><input type="file" name="file" accept=".json,application/json" /></label>`, 'Restore')); onSubmit = async () => { const f = document.querySelector('#mf [name=file]').files[0]; if (!f) return; const txt = await f.text(); const parsed = JSON.parse(txt); if (!parsed.persons) throw new Error('Not a backup file'); S = parsed; save(); closeModal(); toast('Restored'); }; },
  exportCsv() { const rows = [['date', 'merchant', 'description', 'amount', 'account', 'who', 'shared', 'category', 'note']]; for (const t of S.transactions) rows.push([t.postedAt, t.merchantName, t.description, t.amount.toFixed(2), S.accounts.find((a) => a.id === t.accountId)?.name || '', name(t.personId), t.splitMode, catLabel(t.categoryId), t.notes || '']); dl(new Blob([rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv' }), `transactions-${today()}.csv`); },
  review(arg) { const [pattern, v] = arg.split('|'); S.reviews[pattern] = v; },
  delBill(id) { S.recurringManual = S.recurringManual.filter((r) => r.id !== id); },
  delRule(i) { S.rules.splice(Number(i), 1); },
  delBudget(id) { S.budgets = S.budgets.filter((b) => b.id !== id); },
  delGoal(id) { if (confirm('Delete this objective?')) { S.goals = S.goals.filter((g) => g.id !== id); S.contributions = S.contributions.filter((c) => c.goalId !== id); } },
  delDebt(id) { if (confirm('Delete this debt?')) S.debts = S.debts.filter((d) => d.id !== id); },
  // ---- forms
  addAccount() { modal('Add account', F.form(F.text('name', 'Name (e.g. Chase Checking …3310)') + F.text('institutionName', 'Bank', '') + F.sel('type', 'Type', [['checking', 'Checking'], ['savings', 'Savings'], ['cash', 'Cash'], ['credit_card', 'Credit card'], ['loan', 'Loan'], ['investment', 'Investment / brokerage'], ['retirement', 'Retirement (401k, IRA)'], ['other_asset', 'Other asset'], ['other_liability', 'Other liability']], 'checking') + F.num('currentBalance', 'Current balance (for cards/loans: amount owed)', 0) + F.who('ownerPersonId', S.persons[0]?.id), 'Add')); onSubmit = () => { const f = formData(); if (!f.name) return; S.accounts.push({ id: uid(), provider: 'manual', institutionName: f.institutionName, name: f.name, type: f.type, mask: null, currency: 'USD', currentBalance: numv(f.currentBalance), availableBalance: numv(f.currentBalance), creditLimit: null, ownerPersonId: f.ownerPersonId || null, includeInNetWorth: true, isDemo: false }); closeModal(); }; },
  editAccount(id) { const a = S.accounts.find((x) => x.id === id); modal('Account', F.form(F.text('name', 'Name', a.name) + F.num('currentBalance', 'Current balance', a.currentBalance) + F.who('ownerPersonId', a.ownerPersonId ?? '') + F.check('includeInNetWorth', 'Include in net worth', a.includeInNetWorth), 'Save', btn('Delete account & its transactions', 'delAccount', id, 'btn small danger'))); onSubmit = () => { const f = formData(); a.name = f.name; a.currentBalance = numv(f.currentBalance); a.availableBalance = a.currentBalance; const newOwner = f.ownerPersonId || null; if (newOwner !== a.ownerPersonId) { for (const t of S.transactions) if (t.accountId === a.id && t.source !== 'manual') t.personId = newOwner; a.ownerPersonId = newOwner; } a.includeInNetWorth = f.includeInNetWorth; closeModal(); }; },
  delAccount(id) { if (confirm('Delete this account and all its transactions?')) { S.accounts = S.accounts.filter((a) => a.id !== id); S.transactions = S.transactions.filter((t) => t.accountId !== id); S.holdings = S.holdings.filter((h) => h.accountId !== id); S.snapshots = S.snapshots.filter((s) => s.accountId !== id); closeModal(); } },
  addTx() { if (!S.accounts.length) return ACT.addAccount(); modal('Add transaction', F.form(F.sel('accountId', 'Account', S.accounts.map((a) => [a.id, a.name])) + F.date('postedAt', 'Date', today()) + F.text('merchantName', 'Merchant / payee') + F.num('amount', 'Amount') + F.sel('dir', 'Direction', [['out', 'Money out (expense)'], ['in', 'Money in (income / refund)']], 'out') + F.cat('categoryId', '') + F.sel('splitMode', 'Shared or personal', [['auto', 'Use category default'], ['shared', 'Shared'], ['personal', 'Personal']], 'auto') + F.text('notes', 'Note'), 'Add')); onSubmit = () => { const f = formData(); if (!f.merchantName || !f.amount) return; const amt = numv(f.amount) * (f.dir === 'in' ? -1 : 1); const acc = S.accounts.find((a) => a.id === f.accountId); const tx = newTx(f.accountId, f.postedAt, f.merchantName, f.merchantName, amt, { categoryId: f.categoryId || undefined, splitMode: f.splitMode === 'auto' ? undefined : f.splitMode, notes: f.notes || null }); if (!f.categoryId) tx.categoryId = tx.categoryId; S.transactions.unshift(tx); S.transactions.sort((a, b) => b.postedAt.localeCompare(a.postedAt)); if (acc && acc.provider === 'manual') { acc.currentBalance = round2(acc.currentBalance + (['credit_card', 'loan', 'other_liability'].includes(acc.type) ? amt : -amt)); acc.availableBalance = acc.currentBalance; } closeModal(); }; },
  editTx(id) { const t = S.transactions.find((x) => x.id === id); modal('Transaction', `<div class="row between"><div><b>${esc(t.merchantName)}</b><div class="small muted">${short(t.postedAt)} · ${esc(S.accounts.find((a) => a.id === t.accountId)?.name || '')}</div></div><b class="num" style="font-size:20px">${money(t.amount)}</b></div>` + F.form(F.text('merchantName', 'Merchant name', t.merchantName) + F.cat('categoryId', t.categoryId) + F.sel('splitMode', 'Shared or personal', [['shared', 'Shared (split by rule)'], ['personal', 'Personal']], t.splitMode) + F.who('personId', t.personId ?? '') + F.text('notes', 'Note', t.notes || '') + F.check('rule', `Always categorise “${esc(t.merchantName)}” this way`, false), 'Save', btn('Delete', 'delTx', id, 'btn small danger'))); onSubmit = () => { const f = formData(); t.merchantName = f.merchantName; t.categoryId = f.categoryId || null; t.splitMode = f.splitMode; t.personId = f.personId || null; t.notes = f.notes || null; if (f.rule && f.categoryId) { const pattern = t.merchantName.toLowerCase().replace(/[#*]\s*\d+.*$/, '').trim(); S.rules.push({ pattern, categorySlug: f.categoryId }); for (const x of S.transactions) if (x.merchantName.toLowerCase().includes(pattern) && x.id !== t.id) x.categoryId = f.categoryId; } closeModal(); }; },
  delTx(id) { S.transactions = S.transactions.filter((t) => t.id !== id); closeModal(); },
  addBudget() { modal('Set budget', F.form(F.cat('categoryId', 'groceries') + F.num('limit', 'Monthly limit ($)', 200, '10'), 'Save')); onSubmit = () => { const f = formData(); if (!f.categoryId) return; const ex = S.budgets.find((b) => b.categoryId === f.categoryId); if (ex) ex.monthlyLimit = numv(f.limit); else S.budgets.push({ id: uid(), categoryId: f.categoryId, monthlyLimit: numv(f.limit) }); closeModal(); }; },
  editBudget(id) { const b = S.budgets.find((x) => x.id === id); modal('Budget', F.form(F.cat('categoryId', b.categoryId) + F.num('limit', 'Monthly limit ($)', b.monthlyLimit, '10'), 'Save')); onSubmit = () => { const f = formData(); b.categoryId = f.categoryId; b.monthlyLimit = numv(f.limit); closeModal(); }; },

function refreshInvestmentBalances() { for (const a of S.accounts.filter((x) => ['investment', 'retirement'].includes(x.type))) { const hs = S.holdings.filter((h) => h.accountId === a.id); if (hs.length) { a.currentBalance = round2(hs.reduce((s, h) => s + h.quantity * h.currentPrice, 0)); a.availableBalance = a.currentBalance; } } }
function dl(blob, filename) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

// ---------------------------------------------------------------- CSV import (Chase, Revolut, generic)
function parseCsv(text) { const rows = []; let row = [], cell = '', q = false; for (let i = 0; i < text.length; i++) { const c = text[i]; if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; } else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += c; } if (cell || row.length) { row.push(cell); rows.push(row); } return rows.filter((r) => r.some((x) => x.trim() !== '')); }
function toIso(s) { s = s.trim(); let m; if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`; if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`; if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/))) return `20${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`; const d = new Date(s); return isNaN(d) ? null : d.toISOString().slice(0, 10); }
function importCsv(text, accountId, negOut) {
  const rows = parseCsv(text); if (rows.length < 2) throw new Error('Empty file'); const header = rows[0].map((h) => h.trim().toLowerCase()); const idx = (...names) => header.findIndex((h) => names.some((n) => h === n || h.includes(n)));
  const isRevolut = header.includes('completed date') && header.includes('state'); const iDate = isRevolut ? idx('completed date') : idx('posting date', 'post date', 'transaction date', 'date'); const iDesc = idx('description', 'payee', 'merchant', 'name', 'memo'); const iAmt = idx('amount'); const iDebit = idx('debit', 'withdrawal'); const iCredit = idx('credit', 'deposit'); const iBal = idx('balance'); const iFee = header.indexOf('fee'); const iState = header.indexOf('state'); const iCat = header.indexOf('category'); const iType = header.indexOf('type');
  if (iDate < 0 || iDesc < 0 || (iAmt < 0 && iDebit < 0)) throw new Error('Could not find date / description / amount columns');
  const acc = S.accounts.find((a) => a.id === accountId); const existing = new Set(S.transactions.filter((t) => t.accountId === accountId).map((t) => t.key || `${t.postedAt}|${t.merchantName}|${t.amount}`)); let added = 0, skipped = 0, latest = null, latestDate = '';
  for (const r of rows.slice(1)) { if (isRevolut && iState >= 0 && r[iState] !== 'COMPLETED') continue; const date = toIso(r[iDate] || ''); if (!date) continue; const desc = (r[iDesc] || '').trim(); let amt; if (iAmt >= 0) { amt = Number(String(r[iAmt]).replace(/[$,\s]/g, '')); if (negOut) amt = -amt; } else { const d = Number(String(r[iDebit] || 0).replace(/[$,\s]/g, '')) || 0, c = Number(String(r[iCredit] || 0).replace(/[$,\s]/g, '')) || 0; amt = d - c; } if (isRevolut && iFee >= 0) amt += Number(r[iFee]) || 0; if (!isFinite(amt) || amt === 0) continue; amt = round2(amt); const key = `${date}|${desc}|${amt}`; if (existing.has(key)) { skipped++; continue; } existing.add(key); S.transactions.push(newTx(accountId, date, desc.replace(/\s+/g, ' ').slice(0, 80), desc, amt, { source: 'provider', key, hint: isRevolut && iType >= 0 && /TOPUP|TRANSFER/i.test(r[iType]) ? 'internal_transfer' : iCat >= 0 ? chaseCategoryHint(r[iCat]) : undefined })); added++; if (iBal >= 0 && date >= latestDate) { const b = Number(String(r[iBal]).replace(/[$,\s]/g, '')); if (isFinite(b)) { latest = b; latestDate = date; } } }
  S.transactions.sort((a, b) => b.postedAt.localeCompare(a.postedAt)); let balance = null; if (acc && latest !== null) { balance = acc.type === 'credit_card' ? Math.abs(latest) : latest; acc.currentBalance = balance; acc.availableBalance = balance; }
  return { added, skipped, balance };
}
function chaseCategoryHint(c) { const m = { 'food & drink': 'restaurants', groceries: 'groceries', gas: 'fuel', shopping: 'shopping', travel: 'travel', entertainment: 'entertainment', 'bills & utilities': 'utilities', 'health & wellness': 'personal_care', 'personal': 'personal', automotive: 'transportation', education: 'personal', 'gifts & donations': 'personal', home: 'housing', 'professional services': 'personal' }; return m[String(c || '').toLowerCase()]; }

/** Headline figures count up from zero (≈450 ms). Skipped when the phone asks for reduced motion. */
function countUp() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const els = document.querySelectorAll('.kpi .value, .big, .flow .value, section.panel > .num, h1.num');
  const start = performance.now(); const items = [];
  for (const el of els) { const m = el.textContent.match(/^([−+]?)\$([\d,]+)(\.\d+)?(\s.*)?$/); if (!m) continue; const target = Number(m[2].replace(/,/g, '')); if (!target) continue; items.push({ el, sign: m[1], target, dec: m[3] ? m[3].length - 1 : 0, tail: m[4] || '' }); el.classList.add('counting'); }
  if (!items.length) return;
  const tick = (now) => { const p = Math.min(1, (now - start) / 450); const e = 1 - Math.pow(1 - p, 3); for (const it of items) { const v = it.target * e; it.el.textContent = it.sign + '$' + v.toLocaleString('en-US', { minimumFractionDigits: it.dec, maximumFractionDigits: it.dec }) + it.tail; } if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

  const close = e.target.closest('[data-close]'); if (close && (e.target === close || !e.target.closest('.modal'))) { if (e.target.closest('.modal') && !e.target.closest('button[data-close]')) return; return closeModal(); }
